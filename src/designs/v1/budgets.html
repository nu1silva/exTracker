<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgets · exTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <template id="screen">
    <div class="{{ cls }}" style="min-height: 100vh">
      <dc-import name="AppNav" active="budgets" theme="{{ theme }}"></dc-import>
      <main class="page">

        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
          <h1 class="h1">Budgets</h1>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
            <div style="display: flex; align-items: center; gap: 2px">
              <button type="button" class="icon-btn" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 9l5 5"></path></svg></button>
              <strong style="font-weight: 650">November 2026</strong>
              <button type="button" class="icon-btn" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 4 5 5-5 5"></path></svg></button>
            </div>
            <button type="button" class="btn">New budget</button>
          </div>
        </div>

        <section class="on-brand" aria-label="Budget summary" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px; padding: 28px 32px; border-radius: 20px; background: var(--hero); color: var(--on-hero)">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-weight: 550">Left for day-to-day spending</span>
            <span class="figure" style="font-size: 52px">{{ sum.left }}</span>
            <span style="color: var(--on-hero-2); font-weight: 500">{{ sum.perDay }}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 16px 40px">
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="color: var(--on-hero-2)">All budgets</span><span class="figure" style="font-size: 24px">{{ sum.limit }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="color: var(--on-hero-2)">Spent</span><span class="figure" style="font-size: 24px">{{ sum.spent }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="color: var(--on-hero-2)">Left with fixed costs</span><span class="figure" style="font-size: 24px">{{ sum.allLeft }}</span></div>
          </div>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
          <section class="card" aria-label="Budgets this month" style="flex: 3 1 600px; display: flex; flex-direction: column; gap: 28px; padding: 28px">
            <div>
              <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 10px"><h2 class="h2">Day-to-day</h2><span class="t3">The line marks today. Bars should not be ahead of it.</span></div>
              <div style="position: relative; padding-top: 26px">
                <div class="pace" aria-hidden="true" style="position: absolute; inset: 0; display: grid; pointer-events: none; z-index: 1">
                  <span></span>
                  <span style="position: relative; display: block; height: 100%">
                    <span style="position: absolute; left: 64.1%; top: 20px; bottom: 0; border-left: 2px solid var(--text)"></span>
                    <span class="tnum" style="position: absolute; left: 64.1%; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap">25 Nov</span>
                  </span>
                  <span></span>
                </div>
                <sc-for list="{{ daily }}" as="b">
                  <button type="button" class="row pace" aria-pressed="{{ b.on }}" onClick="{{ b.pick }}" style="min-height: 78px">
                    <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 650; font-size: 15px">{{ b.name }}</span><span class="t3 tnum">{{ b.spent }} of {{ b.limit }}</span></span>
                    <span style="position: relative; display: block; height: 18px">
                      <span style="position: absolute; inset: 0 auto 0 0; width: 76.92%; border-radius: 4px; background: var(--track)"></span>
                      <span style="position: absolute; inset: 0 auto 0 0; width: {{ b.fill }}%; border-radius: 0 4px 4px 0; background: {{ b.color }}"></span>
                      <span class="hatch" style="position: absolute; top: 0; bottom: 0; left: calc(76.92% + 2px); width: {{ b.over }}%"></span>
                    </span>
                    <span style="display: flex; flex-direction: column; align-items: flex-end; text-align: right"><span class="tnum" style="font-weight: 650; color: {{ b.tone }}">{{ b.left }}</span><span class="t3 tnum">{{ b.pace }}</span></span>
                  </button>
                </sc-for>
              </div>
            </div>
            <div>
              <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 10px"><h2 class="h2">Fixed costs</h2><span class="t3">Paid once a month, so they are not measured against the day.</span></div>
              <sc-for list="{{ fixed }}" as="b">
                <button type="button" class="row pace" aria-pressed="{{ b.on }}" onClick="{{ b.pick }}" style="min-height: 70px">
                  <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 650; font-size: 15px">{{ b.name }}</span><span class="t3 tnum">{{ b.spent }} of {{ b.limit }}</span></span>
                  <span style="position: relative; display: block; height: 18px">
                    <span style="position: absolute; inset: 0 auto 0 0; width: 76.92%; border-radius: 4px; background: var(--track)"></span>
                    <span style="position: absolute; inset: 0 auto 0 0; width: {{ b.fill }}%; border-radius: 0 4px 4px 0; background: {{ b.color }}"></span>
                    <span class="hatch" style="position: absolute; top: 0; bottom: 0; left: calc(76.92% + 2px); width: {{ b.over }}%"></span>
                  </span>
                  <span class="tnum right" style="font-weight: 650; color: {{ b.tone }}">{{ b.left }}</span>
                </button>
              </sc-for>
            </div>
            <div class="t3" style="display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: auto">
              <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 18px; height: 10px; border-radius: 3px; background: var(--track)"></span>Not spent yet</span>
              <span style="display: inline-flex; align-items: center; gap: 8px"><span class="hatch" style="width: 18px; height: 10px; border-radius: 3px"></span>Over the limit</span>
            </div>
          </section>

          <section class="card" aria-label="Selected budget" style="flex: 2 1 400px; display: flex; flex-direction: column; gap: 22px; padding: 28px">
            <div style="display: flex; align-items: center; gap: 12px"><span class="swatch" style="background: {{ sel.color }}; width: 14px; height: 14px"></span><h2 class="h2" style="font-size: 20px">{{ sel.name }}</h2></div>
            <label class="label">Monthly limit in euros
              <input class="field tnum" type="number" min="1" step="10" value="{{ sel.limitRaw }}" onChange="{{ sel.setLimit }}">
            </label>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px"><h3 class="h2" style="font-size: 15px">Last six months</h3><span class="t3 tnum" style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 16px; border-top: 2px solid var(--text)"></span>Limit {{ sel.limit }}</span></div>
              <div role="img" aria-label="Monthly spending for the last six months compared with the limit; values are in the table below" style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); height: 170px; border-bottom: 1px solid var(--line-2)">
                <sc-for list="{{ sel.history }}" as="h">
                  <span style="display: flex; align-items: flex-end; justify-content: center; height: 100%"><span style="width: 24px; height: {{ h.h }}%; border-radius: 4px 4px 0 0; background: {{ h.color }}"></span></span>
                </sc-for>
                <span style="position: absolute; left: 0; right: 0; bottom: {{ sel.line }}%; border-top: 2px solid var(--text)"></span>
              </div>
              <div class="t3" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center">
                <sc-for list="{{ sel.history }}" as="h"><span>{{ h.m }}</span></sc-for>
              </div>
            </div>
            <ul>
              <sc-for list="{{ sel.table }}" as="h">
                <li style="display: grid; grid-template-columns: minmax(0, 1fr) auto 130px; gap: 12px; align-items: center; min-height: 38px; border-top: 1px solid var(--line)"><span>{{ h.long }}</span><span class="tnum" style="font-weight: 600">{{ h.v }}</span><span class="tnum right t3" style="color: {{ h.tone }}">{{ h.d }}</span></li>
              </sc-for>
            </ul>
          </section>
        </div>

      </main>
    </div>
  </template>
  <div id="app"></div>

  <script src="prototype.js"></script>
  <script src="parts/record-form.js"></script>
  <script src="parts/app-nav.js"></script>
  <script>
  class Component extends DCLogic {
    state = { id: 'food', limits: { food: 500, transport: 180, shopping: 150, leisure: 160, housing: 1200, health: 140 } };

    renderVals() {
      const s = this.state;
      const theme = this.props.theme === 'dark' ? 'dark' : 'light';
      const money = (n) => (n < 0 ? '−' : '') + '€' + Math.abs(n).toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const r2 = (n) => Math.round(n * 100) / 100;
      const base = {
        food: ['Food', [472.1, 518.4, 495.2, 461.85, 528.6, 428.6]],
        transport: ['Transport', [171, 204.5, 122, 168.3, 186.5, 164.5]],
        shopping: ['Shopping', [96.4, 142, 210.75, 88.1, 187.2, 187.9]],
        leisure: ['Leisure', [140.2, 188.6, 231, 118.45, 207.5, 112.35]],
        housing: ['Housing', [1175, 1172, 1170, 1174, 1180, 1180]],
        health: ['Health', [138, 138, 138, 138, 138, 138]]
      };
      const make = (id) => {
        const [name, hist] = base[id];
        const spent = hist[5], limit = s.limits[id];
        const ahead = r2(spent - limit * 25 / 30);
        const over = spent > limit;
        return {
          id, name, rawSpent: spent, rawLimit: limit, on: s.id === id,
          color: 'var(--cat-' + id + ')',
          spent: money(spent), limit: money(limit),
          fill: (Math.min(spent, limit) / limit / 1.3 * 100).toFixed(2),
          over: Math.min(23, Math.max(0, spent - limit) / limit / 1.3 * 100).toFixed(2),
          left: over ? money(r2(spent - limit)) + ' over' : money(r2(limit - spent)) + ' left',
          tone: over ? 'var(--over-text)' : 'var(--text)',
          pace: over ? 'Over the limit' : money(Math.abs(ahead)) + (ahead > 0 ? ' ahead of today' : ' under today'),
          pick: () => this.setState({ id })
        };
      };
      const daily = ['food', 'transport', 'shopping', 'leisure'].map(make);
      const fixed = ['housing', 'health'].map(make);
      const leftOf = (xs) => r2(xs.reduce((t, b) => t + b.rawLimit - b.rawSpent, 0));
      const left = leftOf(daily), every = daily.concat(fixed);

      const [name, hist] = base[s.id];
      const limit = s.limits[s.id];
      const top = Math.max(limit, ...hist) * 1.08;
      const short = ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
      const long = ['June', 'July', 'August', 'September', 'October', 'November so far'];
      const history = hist.map((v, i) => ({
        m: short[i], long: long[i], v: money(v),
        h: (v / top * 100).toFixed(2),
        color: i === 5 ? 'var(--cat-' + s.id + ')' : 'var(--prev)',
        d: v > limit ? money(r2(v - limit)) + ' over' : money(r2(limit - v)) + ' under',
        tone: v > limit ? 'var(--over-text)' : 'var(--text-3)'
      }));

      return {
        theme, cls: theme === 'light' ? 'ex ex-light' : 'ex',
        daily, fixed,
        sum: {
          left: money(left),
          perDay: left > 0 ? money(r2(left / 5)) + ' a day for the 5 days until 30 November' : 'Nothing left for the 5 days until 30 November',
          limit: money(every.reduce((t, b) => t + b.rawLimit, 0)),
          spent: money(r2(every.reduce((t, b) => t + b.rawSpent, 0))),
          allLeft: money(leftOf(every))
        },
        sel: {
          name, color: 'var(--cat-' + s.id + ')',
          limit: money(limit), limitRaw: limit,
          setLimit: (e) => { const n = parseFloat(e.target.value); if (n > 0) this.setState({ limits: { ...s.limits, [s.id]: n } }); },
          line: (limit / top * 100).toFixed(2),
          history, table: history.slice().reverse()
        }
      };
    }
  }

    Prototype.screen(Component);
  </script>
</body>
</html>
