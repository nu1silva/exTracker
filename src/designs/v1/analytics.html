<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · exTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <template id="screen">
    <div class="{{ cls }}" style="min-height: 100vh">
      <dc-import name="AppNav" active="analytics" theme="{{ theme }}"></dc-import>
      <main class="page">

        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 32px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h1 class="h1">Analytics</h1>
            <span class="t2 tnum">December 2025 to 25 November 2026, in euros</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
            <label class="label" style="width: 180px">Period
              <select class="field"><option>Last 12 months</option><option>This month</option><option>This year</option><option>Custom range</option></select>
            </label>
            <label class="label" style="width: 180px">Account
              <select class="field"><option>All accounts</option><option>ING Checking</option><option>bunq Savings</option><option>bunq Travel</option><option>Wise USD</option><option>Revolut EUR</option><option>Cash</option></select>
            </label>
            <button type="button" class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8m0 0 3-3m-3 3L5 7M2.5 13.5h11"></path></svg>Export CSV</button>
          </div>
        </div>

        <section class="card" style="display: flex; flex-direction: column; gap: 22px; padding: 28px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
            <h2 class="h2">Income against expenses</h2>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
              <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2)"><span style="width: 12px; height: 12px; border-radius: 3px; background: var(--in)"></span>Income</span>
              <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2)"><span style="width: 12px; height: 12px; border-radius: 3px; background: var(--out)"></span>Expenses</span>
              <div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="{{ isChart }}" onClick="{{ showChart }}">Chart</button><button type="button" aria-pressed="{{ isTable }}" onClick="{{ showTable }}">Table</button></div>
            </div>
          </div>

          <div aria-live="polite" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 14px 32px">
            <div style="display: flex; flex-direction: column; gap: 3px"><span class="t2">{{ m.title }}</span><span class="figure" style="font-size: 26px">{{ m.kept }} {{ m.word }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span class="t2">Income</span><span class="figure" style="font-size: 26px">{{ m.in }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span class="t2">Expenses</span><span class="figure" style="font-size: 26px">{{ m.out }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span class="t2">12 months, after €1.67 exchange loss</span><span class="figure" style="font-size: 26px">€7,302.58 kept</span></div>
          </div>

          <sc-if value="{{ isChart }}">
            <div style="overflow-x: auto">
              <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 10px; min-width: 640px; padding-top: 8px">
                <div class="tnum t3" style="position: relative; height: 230px; font-size: 12px">
                  <span style="position: absolute; right: 0; bottom: 92.31%; transform: translateY(50%)">€6,000</span>
                  <span style="position: absolute; right: 0; bottom: 61.54%; transform: translateY(50%)">€4,000</span>
                  <span style="position: absolute; right: 0; bottom: 30.77%; transform: translateY(50%)">€2,000</span>
                  <span style="position: absolute; right: 0; bottom: 0; transform: translateY(50%)">€0</span>
                </div>
                <div style="position: relative; height: 262px">
                  <div style="position: absolute; left: 0; right: 0; bottom: calc(32px + 212.3px); border-top: 1px solid var(--line)"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: calc(32px + 141.5px); border-top: 1px solid var(--line)"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: calc(32px + 70.8px); border-top: 1px solid var(--line)"></div>
                  <div style="position: absolute; left: 0; right: 0; bottom: 32px; border-top: 1px solid var(--line-2)"></div>
                  <div style="position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; height: 262px">
                    <sc-for list="{{ months }}" as="x">
                      <button type="button" aria-pressed="{{ x.on }}" aria-label="{{ x.label }}" onClick="{{ x.pick }}" style="display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 8px; background: {{ x.bg }}; overflow: hidden">
                        <span style="display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 230px; width: 100%">
                          <span style="width: 18px; height: {{ x.hi }}%; border-radius: 4px 4px 0 0; background: var(--in)"></span>
                          <span style="width: 18px; height: {{ x.ho }}%; border-radius: 4px 4px 0 0; background: var(--out)"></span>
                        </span>
                        <span style="display: flex; align-items: center; justify-content: center; height: 32px; width: 100%; font-size: 13px; font-weight: {{ x.weight }}">{{ x.name }}</span>
                      </button>
                    </sc-for>
                  </div>
                </div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ isTable }}">
            <div style="overflow-x: auto">
              <div style="min-width: 560px">
                <div class="t3" style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 140px); gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-2)"><span>Month</span><span class="right">Income</span><span class="right">Expenses</span><span class="right">Kept</span></div>
                <ul>
                  <sc-for list="{{ months }}" as="x">
                    <li class="tnum" style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 140px); gap: 12px; align-items: center; min-height: 40px; border-bottom: 1px solid var(--line)"><span>{{ x.long }}</span><span class="right">{{ x.in }}</span><span class="right">{{ x.out }}</span><span class="right" style="font-weight: 650">{{ x.kept }}</span></li>
                  </sc-for>
                </ul>
              </div>
            </div>
          </sc-if>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
          <section class="card" style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 18px; padding: 28px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px">
              <h2 class="h2">Spending by category</h2>
              <span class="t3" style="display: inline-flex; align-items: center; gap: 8px"><span style="height: 14px; border-left: 2px solid var(--text)"></span>1 to 25 Oct</span>
            </div>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{ cats }}" as="c">
                <button type="button" class="row catbar" aria-expanded="{{ c.open }}" onClick="{{ c.toggle }}" style="min-height: 50px">
                  <span class="clip" style="font-weight: 600">{{ c.name }}</span>
                  <span style="position: relative; display: block; height: 16px">
                    <span style="position: absolute; inset: 0 auto 0 0; width: {{ c.w }}%; border-radius: 0 4px 4px 0; background: {{ c.color }}"></span>
                    <span style="position: absolute; top: -4px; bottom: -4px; left: {{ c.prev }}%; border-left: 2px solid var(--text)"></span>
                  </span>
                  <span class="tnum right" style="font-weight: 650">{{ c.amount }}</span>
                </button>
                <sc-if value="{{ c.open }}">
                  <ul style="padding: 2px 0 10px">
                    <sc-for list="{{ c.subs }}" as="s">
                      <li class="catbar" style="display: grid; gap: 12px; align-items: center; min-height: 38px">
                        <span class="clip t2" style="padding-left: 14px">{{ s.name }}</span>
                        <span style="display: block; height: 8px; width: {{ s.w }}%; border-radius: 0 4px 4px 0; background: {{ c.color }}; opacity: 0.6"></span>
                        <span class="tnum right t2">{{ s.amount }}</span>
                      </li>
                    </sc-for>
                    <li><a href="records.html" style="display: inline-flex; align-items: center; min-height: 44px; padding-left: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px">See these records</a></li>
                  </ul>
                </sc-if>
              </sc-for>
            </div>
          </section>

          <section class="card" style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 18px; padding: 28px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px">
              <h2 class="h2">Balance over time</h2>
              <span class="t3">End of each month</span>
            </div>
            <div aria-live="polite" style="display: flex; flex-direction: column; gap: 3px"><span class="figure" style="font-size: 26px">{{ bal.value }}</span><span class="t2">{{ bal.label }}</span></div>
            <div style="flex: 1 1 260px; display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: minmax(240px, 1fr) auto; gap: 0 10px">
              <div class="tnum t3" style="position: relative; font-size: 12px">
                <span style="position: absolute; right: 0; top: 0; transform: translateY(-50%)">€10,000</span>
                <span style="position: absolute; right: 0; top: 50%; transform: translateY(-50%)">€5,000</span>
                <span style="position: absolute; right: 0; top: 100%; transform: translateY(-50%)">€0</span>
              </div>
              <div onPointerMove="{{ bal.move }}" onPointerLeave="{{ bal.leave }}" style="position: relative; border-bottom: 1px solid var(--line-2)">
                <div style="position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--line)"></div>
                <div style="position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line)"></div>
                <div style="position: absolute; top: 0; bottom: 0; left: {{ bal.x }}%; border-left: 1px solid var(--text-3)"></div>
                <svg role="img" aria-label="Total balance at the end of each month, from 2,033 euros in November 2025 to 9,335 euros on 25 November 2026" viewBox="0 0 600 300" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
                  <path d="{{ bal.area }}" fill="var(--now)" opacity="0.1"></path>
                  <path d="{{ bal.path }}" fill="none" stroke="var(--now)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
                </svg>
                <div style="position: absolute; left: {{ bal.x }}%; top: {{ bal.y }}%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--now); border: 2px solid var(--surface)"></div>
              </div>
              <span></span>
              <div class="t3" style="display: flex; justify-content: space-between; padding-top: 8px; font-size: 12px"><span>Nov 2025</span><span>Feb</span><span>May</span><span>Aug</span><span>Nov 2026</span></div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </template>
  <div id="app"></div>

  <script src="prototype.js"></script>
  <script src="parts/record-form.js"></script>
  <script src="parts/app-nav.js"></script>
  <script>
  class Component extends DCLogic {
    state = { view: 'chart', month: 11, open: 'food', hover: null };

    renderVals() {
      const s = this.state;
      const theme = this.props.theme === 'dark' ? 'dark' : 'light';
      const money = (n) => (n < 0 ? '−' : '') + '€' + Math.abs(n).toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const r2 = (n) => Math.round(n * 100) / 100;

      const names = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
      const longs = ['December 2025', 'January 2026', 'February 2026', 'March 2026', 'April 2026', 'May 2026', 'June 2026', 'July 2026', 'August 2026', 'September 2026', 'October 2026', 'November 2026'];
      const inc = [3380, 3280, 3280, 3280, 3430, 6240, 3280, 3280, 3360, 3280, 3280, 3450];
      const exp = [2984.2, 2912.65, 2968.9, 3090.15, 3022.4, 4870.75, 2455.3, 3318.6, 2870.25, 2301.4, 2471.8, 2249.35];
      const months = names.map((name, i) => {
        const kept = r2(inc[i] - exp[i]);
        return {
          name, long: longs[i], on: i === s.month,
          in: money(inc[i]), out: money(exp[i]), kept: money(kept),
          hi: (inc[i] / 6500 * 100).toFixed(2), ho: (exp[i] / 6500 * 100).toFixed(2),
          bg: i === s.month ? 'var(--raised)' : 'transparent',
          weight: i === s.month ? 700 : 500,
          label: longs[i] + ': income ' + money(inc[i]) + ', expenses ' + money(exp[i]),
          pick: () => this.setState({ month: i })
        };
      });
      const k = r2(inc[s.month] - exp[s.month]);

      const raw = [
        ['housing', 'Housing', 1180, 1180, [['Rent', 1020], ['Energy', 118], ['Internet', 42]]],
        ['food', 'Food', 428.6, 476.9, [['Groceries', 296.4], ['Restaurants', 132.2]]],
        ['shopping', 'Shopping', 187.9, 171.3, [['Clothing', 89.9], ['Online orders', 64.2], ['Home', 33.8]]],
        ['transport', 'Transport', 164.5, 162, [['Public transport', 96.5], ['Car share', 68]]],
        ['health', 'Health', 138, 138, [['Insurance', 138]]],
        ['leisure', 'Leisure', 112.35, 189.2, [['Going out', 65.5], ['Books', 33.86], ['Subscriptions', 12.99]]],
        ['other', 'Credit card bill', 38, 44, [['November statement', 38]]]
      ];
      const w = (v) => (v / 1200 * 100).toFixed(2);
      const cats = raw.map(([id, name, v, prev, subs]) => ({
        name, color: 'var(--cat-' + id + ')', w: w(v), prev: w(prev), amount: money(v),
        open: s.open === id,
        toggle: () => this.setState({ open: s.open === id ? null : id }),
        subs: subs.map(([n, a]) => ({ name: n, w: w(a), amount: money(a) }))
      }));

      const series = [2032.87];
      inc.forEach((v, i) => series.push(r2(series[i] + v - exp[i] - (i === 11 ? 1.67 : 0))));
      const pts = series.map((v, i) => [i / 12 * 600, (10000 - v) / 10000 * 300]);
      const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const h = s.hover === null ? 12 : s.hover;

      return {
        theme, cls: theme === 'light' ? 'ex ex-light' : 'ex',
        isChart: s.view === 'chart', isTable: s.view === 'table',
        showChart: () => this.setState({ view: 'chart' }),
        showTable: () => this.setState({ view: 'table' }),
        months,
        m: {
          title: longs[s.month] + (s.month === 11 ? ', to the 25th' : ''),
          kept: money(Math.abs(k)), word: k < 0 ? 'short' : 'kept',
          in: money(inc[s.month]), out: money(exp[s.month])
        },
        cats,
        bal: {
          path, area: path + ' L600 300 L0 300 Z',
          x: (h / 12 * 100).toFixed(2),
          y: ((10000 - series[h]) / 100).toFixed(2),
          value: money(series[h]),
          label: h === 12 ? 'On 25 November 2026' : h === 0 ? 'End of November 2025' : 'End of ' + longs[h - 1],
          move: (e) => {
            const r = e.currentTarget.getBoundingClientRect();
            const i = Math.round((e.clientX - r.left) / r.width * 12);
            this.setState({ hover: Math.max(0, Math.min(12, i)) });
          },
          leave: () => this.setState({ hover: null })
        }
      };
    }
  }

    Prototype.screen(Component);
  </script>
</body>
</html>
