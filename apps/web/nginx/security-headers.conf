# Included by the server and by every location that sets its own add_header: nginx drops the
# server's add_header lines inside a location that has any. "always" adds them to errors too.
# The app loads scripts, styles and fonts only from its own origin, and never runs inline code.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
